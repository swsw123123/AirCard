name: Build AirCard-iOS IPA

# 手動実行のみ。push/PR等の自動トリガーは付けない
# （意図しない連続実行でビルド時間を浪費しないため）
on:
  workflow_dispatch:

# 同時実行を1つに制限し、古い実行が残っていればキャンセルする
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    # 2026年時点の macos-latest は macOS 15 (arm64) 相当で、
    # Xcode 16.x が複数バージョンプリインストールされている
    runs-on: macos-latest

    # 暴走・ハング対策のセーフティネット（想定は数分〜十数分）
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 自分のForkが本家と同期できているか分からない状態を切り分けから
          # 除外するため、本家(Mak5er/AirCard-iOS)のmainを直接取得する。
          # 自分のFork独自の変更を反映させたい場合は、以下2行を消すか
          # 自分のFork(owner/AirCard-iOS)とブランチ名に書き換える
          repository: Mak5er/AirCard-iOS
          ref: main

      - name: Debug - show workspace contents
        # build-ipa.shが実際に存在するか、どのブランチ/コミットが
        # チェックアウトされているかをここで確定させる
        run: |
          echo "Current ref:"
          git rev-parse --abbrev-ref HEAD
          git log -1 --oneline
          echo "---"
          echo "Workspace contents:"
          ls -la

      - name: Select Xcode version
        # ランナーのイメージ更新でプリインストール済みバージョンは変わるため、
        # 固定バージョンを決め打ちせず「そのランナーにある最新安定版」を使う。
        # READMEのRequirements（Xcode 16+）は満たしつつ、
        # このプロジェクトが対象とするiOS 26/27系SDKにも対応できる
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Install XcodeGen
        run: brew install xcodegen

      # rust-core を変更していない限り、リポジトリに同梱済みの
      # AirliftFFI.xcframework で足りるため、Rustツールチェインの
      # インストールは不要（同梱物を変更した場合のみ有効化する）
      # - name: Install Rust toolchain
      #   run: |
      #     curl https://sh.rustup.rs -sSf | sh -s -- -y
      #     source "$HOME/.cargo/env"
      #     rustup target add aarch64-apple-ios

      - name: Build IPA
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS-ipa
          path: build/AirCard-iOS.ipa
          # 保存期間を短くしてストレージ消費を抑える
          retention-days: 7
